<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>وضعیت ورزشکارها | Healthy Nutrition Plan</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/plan.css">
  <link rel="stylesheet" href="css/platform.css">
  <link rel="icon" type="image/png" href="/assets/logo-mark.png">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <header class="bmi-like">
      <a href="index.html" class="back">بازگشت</a>
      <h1>وضعیت ورزشکارها</h1>
      <span class="header-spacer" aria-hidden="true"></span>
    </header>
    <main class="pad">
      <p class="note">مربی و ورزشکار را از فهرست انتخاب کن. اگر نام زیاد شد، همان‌جا جست‌وجو کن.</p>
      <label class="lookup">مربی
        <input id="coach-lookup" type="search" placeholder="نام مربی را بنویس" autocomplete="off">
        <div id="coach-menu" class="lookup-menu" hidden></div>
      </label>
      <label class="lookup">ورزشکار
        <input id="athlete-lookup" type="search" placeholder="نام ورزشکار را بنویس" autocomplete="off">
        <div id="athlete-menu" class="lookup-menu" hidden></div>
      </label>
      <div class="range-switch">
        <button type="button" class="tab active" id="btn-day">روز</button>
        <button type="button" class="tab" id="btn-month">ماه</button>
      </div>
      <div class="card">
        <div class="day-nav">
          <button type="button" id="prev" aria-label="قبل">‹</button>
          <div class="day-label" id="day-label"></div>
          <button type="button" id="next" aria-label="بعد">›</button>
        </div>
        <div id="week-strip" class="week-strip"></div>
        <div id="month-wrap" hidden>
          <div class="month-grid" id="month-grid"></div>
        </div>
      </div>
      <p id="err" class="error-message" hidden></p>
      <div id="list"></div>
    </main>
  </div>
  <script src="js/i18n.js"></script>
  <script src="js/account.js"></script>
  <script>
    const STATUS = {
      followed: 'مطابق برنامه',
      substitute: 'غذای دیگری خورده',
      missed: 'ثبت نشده',
      extra: 'خارج از برنامه ثبت شده',
    };
    const PERSIAN_DIGITS = '۰۱۲۳۴۵۶۷۸۹';
    const JALALI_MONTHS = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];
    let focus = new Date();
    let monthMode = false;
    let coachId = new URLSearchParams(location.search).get('coach') || '';
    let athleteId = '';
    let review = null;

    function toPersianDigits(num) {
      return String(num).replace(/\d/g, (d) => PERSIAN_DIGITS[Number(d)]);
    }
    function gregorianToJalali(gy, gm, gd) {
      const g_d_m = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
      const gy2 = gm > 2 ? gy + 1 : gy;
      let days = 355666 + 365 * gy + Math.floor((gy2 + 3) / 4) - Math.floor((gy2 + 99) / 100) + Math.floor((gy2 + 399) / 400) + gd + g_d_m[gm - 1];
      let jy = -1595 + 33 * Math.floor(days / 12053);
      days %= 12053;
      jy += 4 * Math.floor(days / 1461);
      days %= 1461;
      if (days > 365) {
        jy += Math.floor((days - 1) / 365);
        days = (days - 1) % 365;
      }
      const jm = days < 186 ? 1 + Math.floor(days / 31) : 7 + Math.floor((days - 186) / 30);
      const jd = 1 + (days < 186 ? days % 31 : (days - 186) % 30);
      return { jy, jm, jd };
    }
    function jalaliToGregorian(jy, jm, jd) {
      jy += 1595;
      let days = -355668 + 365 * jy + Math.floor(jy / 33) * 8 + Math.floor(((jy % 33) + 3) / 4) + jd + (jm < 7 ? (jm - 1) * 31 : (jm - 7) * 30 + 186);
      let gy = 400 * Math.floor(days / 146097);
      days %= 146097;
      if (days > 36524) {
        gy += 100 * Math.floor(--days / 36524);
        days %= 36524;
        if (days >= 365) days += 1;
      }
      gy += 4 * Math.floor(days / 1461);
      days %= 1461;
      if (days > 365) {
        gy += Math.floor((days - 1) / 365);
        days = (days - 1) % 365;
      }
      const gd = days + 1;
      const leap = (gy % 4 === 0 && gy % 100 !== 0) || gy % 400 === 0;
      const sal = [0, 31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
      let gm = 1;
      let day = gd;
      for (; gm <= 12 && day > sal[gm]; gm++) day -= sal[gm];
      return new Date(gy, gm - 1, day, 12);
    }
    function isJalaliLeap(jy) {
      const breaks = [-61, 9, 38, 199, 426, 686, 756, 818, 1111, 1181, 1210, 1635, 2060, 2097, 2192, 2262, 2324, 2394, 2456, 3178];
      let jp = breaks[0];
      let jump = 0;
      let leap = 0;
      for (let i = 1; i < breaks.length; i++) {
        const jm = breaks[i];
        jump = jm - jp;
        if (jy < jm) break;
        jp = jm;
      }
      let n = jy - jp;
      if (jump - n < 6) n = n - jump + Math.floor((jump + 4) / 33) * 33;
      leap = ((((n + 1) % 33) - 1) % 4);
      if (leap === -1) leap = 4;
      return leap === 0;
    }
    function jalaliMonthLength(jy, jm) {
      if (jm <= 6) return 31;
      if (jm <= 11) return 30;
      return isJalaliLeap(jy) ? 30 : 29;
    }
    function startOfWeek(date) {
      const copy = new Date(date);
      copy.setDate(copy.getDate() - ((copy.getDay() + 1) % 7));
      copy.setHours(12, 0, 0, 0);
      return copy;
    }
    function shiftMonth(delta) {
      if (I18N.getLang() !== 'fa') {
        focus.setMonth(focus.getMonth() + delta);
        return;
      }
      const j = gregorianToJalali(focus.getFullYear(), focus.getMonth() + 1, focus.getDate());
      let jm = j.jm + delta;
      let jy = j.jy;
      while (jm > 12) { jm -= 12; jy += 1; }
      while (jm < 1) { jm += 12; jy -= 1; }
      focus = jalaliToGregorian(jy, jm, Math.min(j.jd, jalaliMonthLength(jy, jm)));
    }
    function visibleRange() {
      if (monthMode && I18N.getLang() === 'fa') {
        const j = gregorianToJalali(focus.getFullYear(), focus.getMonth() + 1, focus.getDate());
        const last = jalaliMonthLength(j.jy, j.jm);
        return { from: HNP.dateKey(jalaliToGregorian(j.jy, j.jm, 1)), to: HNP.dateKey(jalaliToGregorian(j.jy, j.jm, last)) };
      }
      if (monthMode) {
        const first = new Date(focus.getFullYear(), focus.getMonth(), 1, 12);
        const last = new Date(focus.getFullYear(), focus.getMonth() + 1, 0, 12);
        return { from: HNP.dateKey(first), to: HNP.dateKey(last) };
      }
      const start = startOfWeek(focus);
      const end = new Date(start);
      end.setDate(start.getDate() + 6);
      return { from: HNP.dateKey(start), to: HNP.dateKey(end) };
    }
    function dayHasLog(key) {
      const athlete = (review?.athletes || []).find((item) => item.id === athleteId);
      if (!athlete) return false;
      return (athlete.days || []).some((day) => day.date === key && day.slots.some((slot) => slot.eaten.length));
    }
    function nameKey(value) {
      return String(value || '').toLowerCase().replace(/ي/g, 'ی').replace(/ك/g, 'ک').replace(/\s+/g, '');
    }
    function bindLookup(input, menu, getItems, onPick) {
      function open() {
        const query = nameKey(input.value);
        const items = getItems().filter((item) => !query || nameKey(item.name).includes(query));
        menu.innerHTML = items.length
          ? items.map((item) => `<button type="button" data-id="${esc(item.id)}">${esc(item.name)}</button>`).join('')
          : '<p class="note">کسی با این نام نیست</p>';
        menu.hidden = false;
        menu.querySelectorAll('button').forEach((btn) => {
          btn.addEventListener('mousedown', (event) => {
            event.preventDefault();
            const picked = getItems().find((item) => item.id === btn.dataset.id);
            if (!picked) return;
            input.value = picked.name;
            menu.hidden = true;
            onPick(picked);
          });
        });
      }
      input.addEventListener('focus', open);
      input.addEventListener('input', open);
    }

    function token() {
      return (HNP.currentUser() || {}).token || '';
    }
    function esc(value) {
      return String(value || '').replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[ch]));
    }
    function showErr(text) {
      const err = document.getElementById('err');
      err.hidden = !text;
      err.textContent = text || '';
    }
    function dayTitle(key) {
      const [y, m, d] = key.split('-').map(Number);
      return new Date(y, m - 1, d, 12).toLocaleDateString('fa-IR', {
        weekday: 'long',
        month: 'long',
        day: 'numeric',
      });
    }
    function slotHtml(slot) {
      const eaten = slot.eaten.length ? slot.eaten.map(esc).join('، ') : 'چیزی ثبت نشده';
      const planned = slot.planned ? `<div>برنامه: ${esc(slot.planned)}</div>` : '';
      return `
        <div class="desk-slot">
          <div><b>${esc(slot.label)}</b> · <span class="desk-tag tag-${esc(slot.status)}">${STATUS[slot.status] || ''}</span></div>
          ${planned}
          <div>ثبت‌شده: ${eaten}</div>
        </div>`;
    }
    function athleteHtml(athlete) {
      const key = HNP.dateKey(focus);
      const day = (athlete.days || []).find((item) => item.date === key);
      const slots = day?.slots || [];
      const counts = { followed: 0, substitute: 0, missed: 0 };
      slots.forEach((slot) => {
        if (counts[slot.status] != null) counts[slot.status] += 1;
      });
      return `
        <article class="price-card">
          <h2>${esc(athlete.name)}</h2>
          <p class="note">${esc(dayTitle(key))}${athlete.planTaken ? '' : ' · هنوز رژیم را نگرفته'}</p>
          <div class="desk-counts">
            <span class="tag-followed">مطابق ${toPersianDigits(counts.followed)}</span>
            <span class="tag-substitute">عوض‌شده ${toPersianDigits(counts.substitute)}</span>
            <span class="tag-missed">ثبت‌نشده ${toPersianDigits(counts.missed)}</span>
          </div>
          ${slots.length ? slots.map(slotHtml).join('') : '<p class="note">برای این روز چیزی در برنامه یا ثبت غذا نیست.</p>'}
        </article>`;
    }
    function paintCalendar() {
      const selectedKey = HNP.dateKey(focus);
      const jalali = I18N.getLang() === 'fa';
      document.getElementById('month-wrap').hidden = !monthMode;
      document.getElementById('week-strip').hidden = monthMode;
      const label = document.getElementById('day-label');
      if (monthMode && jalali) {
        const j = gregorianToJalali(focus.getFullYear(), focus.getMonth() + 1, focus.getDate());
        label.textContent = `${JALALI_MONTHS[j.jm - 1]} ${toPersianDigits(j.jy)}`;
      } else if (monthMode) {
        label.textContent = focus.toLocaleDateString(I18N.locale(), { month: 'long', year: 'numeric' });
      } else {
        label.textContent = '';
      }
      if (!monthMode) {
        const start = startOfWeek(focus);
        const cells = [];
        for (let i = 0; i < 7; i++) {
          const date = new Date(start);
          date.setDate(start.getDate() + i);
          const key = HNP.dateKey(date);
          const j = gregorianToJalali(date.getFullYear(), date.getMonth() + 1, date.getDate());
          const dayNum = jalali ? toPersianDigits(j.jd) : String(date.getDate());
          const mark = dayHasLog(key) ? 'ثبت' : '—';
          cells.push(
            `<button type="button" class="week-cell ${key === selectedKey ? 'selected' : ''} ${dayHasLog(key) ? 'is-logged' : ''}" data-day="${key}"><span class="week-day">${I18N.t('wd.' + i)} ${dayNum}</span><span class="week-cal">${mark}</span></button>`
          );
        }
        const strip = document.getElementById('week-strip');
        strip.innerHTML = cells.join('');
        strip.querySelectorAll('[data-day]').forEach((btn) => {
          btn.addEventListener('click', () => {
            focus = new Date(`${btn.dataset.day}T12:00:00`);
            paintCalendar();
            paintAthletes();
          });
        });
        return;
      }
      let first;
      let daysInMonth;
      let year;
      let month;
      let jalaliYear;
      let jalaliMonth;
      if (jalali) {
        const j = gregorianToJalali(focus.getFullYear(), focus.getMonth() + 1, focus.getDate());
        jalaliYear = j.jy;
        jalaliMonth = j.jm;
        daysInMonth = jalaliMonthLength(j.jy, j.jm);
        first = jalaliToGregorian(j.jy, j.jm, 1);
      } else {
        year = focus.getFullYear();
        month = focus.getMonth();
        first = new Date(year, month, 1, 12);
        daysInMonth = new Date(year, month + 1, 0).getDate();
      }
      const startWeekday = (first.getDay() + 1) % 7;
      const cells = [0, 1, 2, 3, 4, 5, 6].map((i) => `<div class="dow">${I18N.t('wd.' + i)}</div>`);
      for (let i = 0; i < startWeekday; i++) cells.push('<div></div>');
      for (let day = 1; day <= daysInMonth; day++) {
        const date = jalali ? jalaliToGregorian(jalaliYear, jalaliMonth, day) : new Date(year, month, day, 12);
        const key = HNP.dateKey(date);
        const logged = dayHasLog(key);
        cells.push(
          `<button type="button" class="month-cell ${key === selectedKey ? 'selected' : ''} ${key === HNP.dateKey(new Date()) ? 'is-today' : ''} ${logged ? 'is-logged' : 'is-empty'}" data-day="${key}"><div class="cal">${jalali ? toPersianDigits(day) : day}</div><div class="dots">${logged ? 'ثبت' : '—'}</div></button>`
        );
      }
      const grid = document.getElementById('month-grid');
      grid.innerHTML = cells.join('');
      grid.querySelectorAll('[data-day]').forEach((btn) => {
        btn.addEventListener('click', () => {
          focus = new Date(`${btn.dataset.day}T12:00:00`);
          paintCalendar();
          paintAthletes();
        });
      });
    }
    function paintAthletes() {
      const list = document.getElementById('list');
      const athletes = review?.athletes || [];
      if (!athletes.length) {
        list.innerHTML = '<p class="note">هنوز ورزشکاری این مربی را انتخاب نکرده.</p>';
        return;
      }
      const athlete = athletes.find((item) => item.id === athleteId);
      list.innerHTML = athlete
        ? athleteHtml(athlete)
        : '<p class="note">یک ورزشکار را از فهرست انتخاب کن.</p>';
    }
    async function load() {
      if (!token()) {
        location.replace('login.html?next=' + encodeURIComponent('coach-desk.html'));
        return;
      }
      const range = visibleRange();
      const params = new URLSearchParams({ from: range.from, to: range.to, date: HNP.dateKey(focus) });
      if (coachId) params.set('coachId', coachId);
      const res = await fetch('/api/coach/review?' + params.toString(), {
        headers: { Authorization: 'Bearer ' + token() },
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        showErr(data.error || 'وضعیت ورزشکارها خوانده نشد');
        return;
      }
      showErr('');
      review = data;
      if (!coachId) coachId = data.coach?.id || '';
      const athletes = data.athletes || [];
      if (!athletes.some((item) => item.id === athleteId)) athleteId = athletes.length === 1 ? athletes[0].id : '';
      const coachInput = document.getElementById('coach-lookup');
      const athleteInput = document.getElementById('athlete-lookup');
      const coach = (data.coaches || []).find((item) => item.id === coachId);
      const athlete = athletes.find((item) => item.id === athleteId);
      if (document.activeElement !== coachInput && coach) coachInput.value = coach.name;
      if (document.activeElement !== athleteInput) athleteInput.value = athlete ? athlete.name : '';
      paintCalendar();
      paintAthletes();
    }
    document.getElementById('btn-day').addEventListener('click', () => {
      monthMode = false;
      document.getElementById('btn-day').classList.add('active');
      document.getElementById('btn-month').classList.remove('active');
      load();
    });
    document.getElementById('btn-month').addEventListener('click', () => {
      monthMode = true;
      document.getElementById('btn-month').classList.add('active');
      document.getElementById('btn-day').classList.remove('active');
      load();
    });
    document.getElementById('prev').addEventListener('click', () => {
      if (monthMode) shiftMonth(-1);
      else focus.setDate(focus.getDate() - 7);
      load();
    });
    document.getElementById('next').addEventListener('click', () => {
      if (monthMode) shiftMonth(1);
      else focus.setDate(focus.getDate() + 7);
      load();
    });
    bindLookup(
      document.getElementById('coach-lookup'),
      document.getElementById('coach-menu'),
      () => review?.coaches || [],
      (picked) => {
        if (picked.id === coachId) return;
        coachId = picked.id;
        athleteId = '';
        document.getElementById('athlete-lookup').value = '';
        load();
      }
    );
    bindLookup(
      document.getElementById('athlete-lookup'),
      document.getElementById('athlete-menu'),
      () => review?.athletes || [],
      (picked) => {
        athleteId = picked.id;
        paintCalendar();
        paintAthletes();
      }
    );
    document.addEventListener('click', (event) => {
      if (!event.target.closest('.lookup')) {
        document.querySelectorAll('.lookup-menu').forEach((menu) => { menu.hidden = true; });
      }
    });
    load();
  </script>
  <script src="js/feedback.js"></script>
</body>
</html>

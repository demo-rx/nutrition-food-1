<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>بازار سلامت | Healthy Nutrition Plan</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/platform.css">
  <link rel="icon" type="image/png" href="/assets/logo-mark.png">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <header class="bmi-like">
      <a href="index.html" class="back">بازگشت</a>
      <h1 id="page-title">بازار سلامت</h1>
      <span class="header-spacer" aria-hidden="true"></span>
    </header>
    <main class="pad">
      <section class="market-banner" id="banner">
        <img id="banner-img" alt="">
        <div class="market-banner-copy">
          <p class="market-kicker" id="banner-kicker">بازار سلامت</p>
          <h2 id="banner-title"></h2>
          <p id="banner-text"></p>
          <a class="btn btn-primary" id="btn-sell" href="market-sell.html" hidden>فروش دستور پخت</a>
        </div>
      </section>
      <div class="market-tabs" role="tablist">
        <a href="#doctors" data-kind="doctors">دکتر تغذیه</a>
        <a href="#recipes" data-kind="recipes">دستور پخت</a>
        <a href="#restaurants" data-kind="restaurants">رستوران سلامت</a>
      </div>
      <div id="list"></div>
    </main>
  </div>
  <script src="js/account.js"></script>
  <script src="js/ads.js"></script>
  <script>
    if (!HNP.currentUser()?.admin) {
      location.replace('index.html');
    }
    const COPY = {
      doctors: {
        title: 'دکتر تغذیه',
        kicker: 'مشاوره تخصصی',
        text: 'پزشک تغذیه را ببین و برای نوبت تماس بگیر.',
        buy: 'رزرو مشاوره',
        image: '/assets/market/doctor.jpg',
      },
      recipes: {
        title: 'دستور پخت سالم',
        kicker: 'آشپزی سالم',
        text: 'دستور پخت بخر یا مال خودت را بفروش.',
        buy: 'خرید دستور پخت',
        image: '/assets/market/dish.jpg',
      },
      restaurants: {
        title: 'رستوران سلامت',
        kicker: 'غذای رژیم',
        text: 'رستوران‌های کم‌کالری و رژیم را پیدا کن.',
        buy: 'تماس با رستوران',
        image: '/assets/market/restaurant.jpg',
      },
    };

    function kindFromHash() {
      const raw = (location.hash || '#doctors').slice(1);
      return COPY[raw] ? raw : 'doctors';
    }

    function esc(value) {
      return String(value || '').replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;',
      }[ch]));
    }

    function telHref(phone) {
      const digits = String(phone || '').replace(/\D/g, '');
      return digits ? 'tel:' + digits : '';
    }

    async function loadList() {
      const kind = kindFromHash();
      const copy = COPY[kind];
      document.getElementById('page-title').textContent = copy.title;
      document.getElementById('banner-kicker').textContent = copy.kicker;
      document.getElementById('banner-title').textContent = copy.title;
      document.getElementById('banner-text').textContent = copy.text;
      document.getElementById('banner-img').src = copy.image;
      document.getElementById('btn-sell').hidden = kind !== 'recipes';
      document.querySelectorAll('.market-tabs a').forEach((link) => {
        link.classList.toggle('active', link.dataset.kind === kind);
      });
      const res = await fetch('/api/market/' + kind);
      const data = await res.json();
      const items = data.items || [];
      const box = document.getElementById('list');
      if (!items.length) {
        box.innerHTML = '<p class="note">هنوز موردی نیست.</p>';
        return;
      }
      box.innerHTML = items.map((item) => {
        const call = telHref(item.phone);
        const action = call
          ? `<a class="btn btn-primary" href="${call}">${esc(copy.buy)}</a>`
          : '';
        const info = `<span class="coach-copy">
            <strong>${esc(item.name)}</strong>
            <span>${esc(item.title)}</span>
            <span>${esc([item.city, item.price].filter(Boolean).join(' · '))}</span>
            <em>${esc(item.bio)}</em>
            ${action}
          </span>`;
        if (kind !== 'doctors' && item.photo) {
          return `<article class="coach-card market-hero">
            <img class="market-hero-bg" src="${esc(item.photo)}" alt="">
            ${info}
          </article>`;
        }
        const photo = item.photo
          ? `<img class="market-photo round" src="${esc(item.photo)}" alt="">`
          : `<span class="market-photo round letter" aria-hidden="true">${esc(String(item.name || '؟').trim().slice(0, 1))}</span>`;
        return `<article class="coach-card">${photo}${info}</article>`;
      }).join('');
    }

    window.addEventListener('hashchange', loadList);
    loadList();
  </script>
  <script src="js/feedback.js"></script>
</body>
</html>

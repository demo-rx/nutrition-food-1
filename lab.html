<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>جواب آزمایش خون | Healthy Nutrition Plan</title>
  <link rel="icon" type="image/png" href="/assets/logo-mark.png">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/plan.css">
</head>
<body>
  <div class="app-shell">
    <header class="plan-header">
      <a href="index.html" class="back-btn" aria-label="بازگشت">←</a>
      <div class="header-title"><span class="fa-text">جواب آزمایش خون</span></div>
      <span class="header-spacer" aria-hidden="true"></span>
    </header>
    <main class="plan-main">
      <section class="view active">
        <div class="card">
          <p class="auth-note">عکس یا PDF آزمایش را بگذار، یا عددها را خودت بنویس. وضعیت را آموزشی می‌گوید، نه تشخیص پزشکی.</p>
          <input id="lab-file" type="file" accept="image/*,.pdf,application/pdf" hidden>
          <button type="button" class="btn btn-primary" id="lab-pick">گذاشتن جواب آزمایش</button>
          <p id="lab-file-name" class="auth-note" hidden></p>
          <div class="vitals-grid">
            <label class="field">قند ناشتا
              <input id="lab-fbs" type="text" inputmode="decimal" dir="ltr" placeholder="mg/dL">
            </label>
            <label class="field">HbA1c
              <input id="lab-hba1c" type="text" inputmode="decimal" dir="ltr" placeholder="%">
            </label>
            <label class="field">کلسترول
              <input id="lab-chol" type="text" inputmode="decimal" dir="ltr" placeholder="mg/dL">
            </label>
            <label class="field">LDL
              <input id="lab-ldl" type="text" inputmode="decimal" dir="ltr" placeholder="mg/dL">
            </label>
            <label class="field">HDL
              <input id="lab-hdl" type="text" inputmode="decimal" dir="ltr" placeholder="mg/dL">
            </label>
            <label class="field">تری‌گلیسرید
              <input id="lab-tg" type="text" inputmode="decimal" dir="ltr" placeholder="mg/dL">
            </label>
            <label class="field">هموگلوبین
              <input id="lab-hb" type="text" inputmode="decimal" dir="ltr" placeholder="g/dL">
            </label>
            <label class="field">ویتامین D
              <input id="lab-vitd" type="text" inputmode="decimal" dir="ltr" placeholder="ng/mL">
            </label>
            <label class="field">ویتامین B12
              <input id="lab-b12" type="text" inputmode="decimal" dir="ltr" placeholder="pg/mL">
            </label>
            <label class="field">فریتین
              <input id="lab-ferritin" type="text" inputmode="decimal" dir="ltr" placeholder="ng/mL">
            </label>
            <label class="field">TSH
              <input id="lab-tsh" type="text" inputmode="decimal" dir="ltr" placeholder="mIU/L">
            </label>
          </div>
          <button type="button" class="btn btn-secondary" id="lab-read">خواندن فایل و دیدن وضعیت</button>
          <div id="lab-wait" hidden>
            <div class="lab-progress" id="lab-progress" dir="ltr"><span id="lab-progress-bar"></span></div>
            <p id="lab-progress-text" class="auth-note">صفحه‌ها را آماده می‌کنم</p>
          </div>
          <p id="lab-error" class="error-message" hidden></p>
        </div>
        <div class="card" id="lab-result" hidden></div>
      </section>
    </main>
  </div>
  <script src="js/i18n.js"></script>
  <script src="js/account.js"></script>
  <script src="js/gate.js"></script>
  <script src="js/lab.js"></script>
  <script src="js/feedback.js"></script>
</body>
</html>
